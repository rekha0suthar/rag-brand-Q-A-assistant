name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # chain.py imports langchain-huggingface at module level, which needs
      # sentence-transformers (and therefore torch), so install the full
      # pinned set -- the CPU wheel index keeps torch small and GPU-free.
      # No API keys needed: the suite never calls an LLM. The AppTest smoke
      # tests and the retrieval eval DO load the FAISS index + MiniLM, so the
      # HF model directory is cached to keep runs fast.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ hashFiles('config.yaml') }}

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest -q

      # Retriever-only quality gate: hit@3 and MRR on the labeled set.
      # Local embeddings, no LLM, exits non-zero when hit@3 < 0.9.
      - name: Retrieval eval
        run: python eval_samples/run_retrieval_eval.py

  # Promote main -> release only when the test job is green. Streamlit
  # Community Cloud tracks the release branch, so broken code never deploys.
  promote:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote main to release
        run: git push --force origin HEAD:release
