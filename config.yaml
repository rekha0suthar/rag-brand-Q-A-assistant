# retrieval
chunk_size: 800
chunk_overlap: 150
top_k: 4

# index
index_dir: faiss_index

# safety
# FAISS similarity scores here are L2 distances (lower = closer). Chunks
# scoring above this are dropped; if none remain, the chain refuses without
# calling the LLM. Calibrated against the 6-doc index: on-corpus queries
# scored 0.85-1.12 (best chunk), unanswerable/off-topic queries 1.33-1.98.
score_threshold: 1.25
refusal_text: "Not enough info in the docs."

# Session ("Your documents") gate. The 1.25 threshold above is calibrated to
# the demo corpus; natural questions over arbitrary uploads score higher.
# Measured on synthetic uploads (resume + warranty policy): answerable
# questions' best chunks 1.08-1.59, off-topic best chunks 1.66-2.11, so 1.6
# separates them. Margin rule: once the best chunk passes, chunks within
# +0.2 of it are kept too (neighboring chunks of the same answer).
session_score_threshold: 1.6
session_score_margin: 0.2

# generation
# provider: "ollama" for local dev (needs `ollama serve` running), or
# "groq" for deployed instances (needs GROQ_API_KEY, no local server).
# Overridable via the LLM_PROVIDER env var without editing this file.
provider: ollama
ollama_model: llama3
groq_model: openai/gpt-oss-120b
temperature: 0.0
