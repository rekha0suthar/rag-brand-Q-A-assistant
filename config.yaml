# retrieval
chunk_size: 800
chunk_overlap: 150
top_k: 4

# index
index_dir: faiss_index
# Used at BOTH ingest and query time -- changing it requires `python ingest.py`
# to rebuild the index, or the stored vectors won't match query embeddings.
embedding_model: sentence-transformers/all-MiniLM-L6-v2

# safety
# FAISS similarity scores here are L2 distances (lower = closer). Chunks
# scoring above this are dropped; if none remain, the chain refuses without
# calling the LLM. Calibrated against the 17-doc index via scripts/calibrate.py
# (2026-11): 30 on-topic questions' best chunks scored 0.594-1.206 (mean 0.870);
# 15 off-topic/absent-fact questions scored 1.339-1.853 (mean 1.63), except one
# near-domain probe ("marketing budget", 1.066) that lands below any usable
# threshold -- that class is caught by the prompt-level refusal instead.
# 1.27 is the midpoint of the clean gap (worst on-topic 1.206, best clearly
# off-topic 1.339). Re-run scripts/calibrate.py after any corpus change.
score_threshold: 1.27
refusal_text: "Not enough info in the docs."

# Session ("Your documents") gate. The demo threshold above is calibrated to
# the demo corpus; natural questions over arbitrary uploads score higher.
# Measured on synthetic uploads (resume + warranty policy): answerable
# questions' best chunks 1.08-1.59, off-topic best chunks 1.66-2.11, so 1.6
# separates them. Margin rule: once the best chunk passes, chunks within
# +0.2 of it are kept too (neighboring chunks of the same answer).
session_score_threshold: 1.6
session_score_margin: 0.2

# generation
# provider: "ollama" for local dev (needs `ollama serve` running), or
# "groq" for deployed instances (needs GROQ_API_KEY, no local server).
# Overridable via the LLM_PROVIDER env var without editing this file.
provider: ollama
ollama_model: llama3
# 20b (not 120b): Groq free-tier quotas are per account PER MODEL, so running
# this app on a different model than ai-resume-tailor (120b) isolates their
# quotas — one demo hitting its daily limit no longer takes down the other.
# Grounded short-context QA holds quality on the smaller model (eval-verified).
groq_model: openai/gpt-oss-20b
temperature: 0.0
